name: Daily Tech & AI Brief

on:
  schedule:
    # Runs every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Allows manual triggering

env:
  DRY_RUN: false
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  
  EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED || 'true' }}
  EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'gmail' }}
  SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
  SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  EMAIL_SUBJECT_PREFIX: ${{ secrets.EMAIL_SUBJECT_PREFIX || 'Daily Tech & AI Brief' }}

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Display run information
        run: |
          echo "Python version:"
          python --version
          echo "Date:"
          date -u
          echo "Output folder will be created at: ./output/"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Full Pipeline
        run: |
          python main.py
          
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        if: always() # Upload even if the script partially fails
        with:
          name: daily-brief-output
          path: output/
          retention-days: 7
